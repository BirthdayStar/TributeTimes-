services:
  - type: web
    name: tribute-times
    env: node
    plan: free
    # History (11 Aug 2026): PDF generation used Playwright, which needs a
    # separate browser download during the build (`npx playwright install
    # ...`). That download reliably hung for 20+ minutes on Render's
    # free-tier build resources — tried the full browser, `--with-deps`
    # (blocked outright, needs root Render doesn't grant), and the smaller
    # headless-shell-only target — all hung or failed the same way. Not a
    # one-off fluke; a real limitation of this build environment.
    # Switched PDF generation to puppeteer-core + @sparticuz/chromium
    # instead (see src/phase2/pdf-service.js) — that package ships its
    # Chromium build already inside the npm package itself (pre-compressed,
    # no separate download step), so it comes down as part of this same
    # plain `npm install`, which has succeeded quickly in every build log
    # so far. No special build command needed any more.
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_VIRAL_SHARE_COUPON_ID
        sync: false
      - key: STRIPE_FLORIST_STANDARD_PACK_30_PRICE_ID
        sync: false
      - key: STRIPE_FLORIST_STANDARD_PACK_60_PRICE_ID
        sync: false
      - key: STRIPE_FLORIST_STANDARD_PACK_120_PRICE_ID
        sync: false
      - key: STRIPE_FLORIST_PREMIUM_FLORAL_PACK_30_PRICE_ID
        sync: false
      - key: STRIPE_FLORIST_PREMIUM_FLORAL_PACK_60_PRICE_ID
        sync: false
      - key: STRIPE_FLORIST_PREMIUM_FLORAL_PACK_120_PRICE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GCASH_ACCOUNT_NAME
        sync: false
      - key: GCASH_MOBILE_NUMBER
        sync: false
      - key: GCASH_QR_IMAGE_URL
        sync: false
      - key: GCASH_PHP_PER_NZD
        sync: false
      - key: GCASH_PAYMENT_INSTRUCTIONS
        sync: false
